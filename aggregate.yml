name: Mise à jour de l'agrégateur

on:
  schedule:
    - cron: "0 */3 * * *"   # toutes les 3 heures
  workflow_dispatch:         # bouton "Run workflow" pour lancer à la main

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Récupérer les flux
        run: node aggregator/aggregate.js
      - name: Enregistrer si changement
        run: |
          git config user.name "aggregator-bot"
          git config user.email "aggregator-bot@users.noreply.github.com"
          git add data/aggregate.json
          git diff --cached --quiet || (git commit -m "Mise à jour automatique des données" && git push)
