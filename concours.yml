name: Mise à jour des concours (Afrique)

on:
  schedule:
    - cron: "0 */6 * * *"   # toutes les 6 heures
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Récupérer les concours
        run: node aggregator/concours.js
      - name: Enregistrer si changement
        run: |
          git config user.name "aggregator-bot"
          git config user.email "aggregator-bot@users.noreply.github.com"
          git add data/concours.json
          git diff --cached --quiet || (git commit -m "Mise à jour des concours" && git push)
