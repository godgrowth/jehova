name: Mise à jour des matchs et cotes

on:
  schedule:
    - cron: "0 6,18 * * *"   # 2 fois par jour (limite le quota de l'API de cotes)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Récupérer matchs et cotes
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}   # facultatif
        run: node aggregator/sports.js
      - name: Enregistrer si changement
        run: |
          git config user.name "aggregator-bot"
          git config user.email "aggregator-bot@users.noreply.github.com"
          git add data/sports.json
          git diff --cached --quiet || (git commit -m "Mise à jour matchs et cotes" && git push)
